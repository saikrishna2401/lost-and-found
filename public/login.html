<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lost & Found Hub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" style="text-decoration:none;"><h2 style="color: var(--primary);">L&F Hub</h2></a>
        <div class="nav-links" id="nav-links"></div>
    </nav>

    <div class="auth-container">
        <div class="glass-card auth-card">
            <h2 class="text-center" style="margin-bottom: 2rem;">Welcome Back</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label>Captcha: <span id="captchaText" style="font-weight:bold; letter-spacing: 2px; background: rgba(0,0,0,0.1); padding: 2px 5px;"></span></label>
                    <input type="text" id="captchaInput" placeholder="Enter Captcha" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Login</button>
                <p class="text-center mt-1">Don't have an account? <a href="/signup" style="color: var(--primary);">Sign Up</a></p>
            </form>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        let currentCaptcha = '';

        document.addEventListener('DOMContentLoaded', () => {
            currentCaptcha = generateCaptcha();
            document.getElementById('captchaText').innerText = currentCaptcha;
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userInput = document.getElementById('captchaInput').value;
            if (userInput !== currentCaptcha) {
                showToast('Invalid Captcha!');
                currentCaptcha = generateCaptcha();
                document.getElementById('captchaText').innerText = currentCaptcha;
                document.getElementById('captchaInput').value = '';
                return;
            }

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showToast('Login successful!');
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    showToast(data.message || 'Login failed');
                }
            } catch (err) {
                showToast('Server error');
            }
        });
    </script>
</body>
</html>
