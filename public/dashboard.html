<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Lost & Found Hub</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .dashboard-container {
            padding: 2rem 5%;
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" style="text-decoration:none;"><h2 style="color: var(--primary);">L&F Hub</h2></a>
        <div class="nav-links" id="nav-links"></div>
    </nav>

    <div class="dashboard-container">
        <h1 style="margin-bottom: 2rem;">Post a New Item</h1>
        <div class="glass-card">
            <form id="postForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select id="type" required>
                        <option value="lost">Lost</option>
                        <option value="found">Found</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="category" placeholder="e.g., Electronics, Keys, Wallet" required>
                </div>
                <div class="form-group">
                    <label>Location (where it was lost/found)</label>
                    <input type="text" id="location" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>Contact Info (Email/Phone)</label>
                    <input type="text" id="contactInfo" required>
                </div>
                <div class="form-group">
                    <label>Upload Image</label>
                    <input type="file" id="image" accept="image/*" onchange="previewImage(event)">
                    <img id="imagePreview" src="" alt="Preview" style="display:none; width:100%; max-height:200px; object-fit:contain; margin-top:1rem;">
                </div>
                <button type="submit" class="btn" style="width:100%;">Submit Item</button>
            </form>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const { token } = checkAuth();
            if (!token) {
                window.location.href = '/login';
            }
        });

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('type', document.getElementById('type').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('location', document.getElementById('location').value);
            formData.append('date', document.getElementById('date').value);
            formData.append('contactInfo', document.getElementById('contactInfo').value);
            
            const imageFile = document.getElementById('image').files[0];
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                const { token } = checkAuth();
                const res = await fetch('/api/items', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                
                if (res.ok) {
                    showToast('Item posted successfully!');
                    setTimeout(() => window.location.href = '/', 1500);
                } else {
                    const data = await res.json();
                    showToast(data.message || 'Failed to post item');
                }
            } catch (err) {
                showToast('Server error');
            }
        });
    </script>
</body>
</html>
