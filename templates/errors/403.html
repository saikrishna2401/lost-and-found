{% extends "base.html" %}
{% block title %}403 Forbidden - Access Denied{% endblock %}
{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <i class="bi bi-shield-lock-fill text-danger display-1 mb-3 d-block"></i>
        <h1 class="fw-bold">403 Access Denied</h1>
        <p class="lead text-muted">You do not have the required permissions to view this resource or perform this action.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">Return to Home</a>
    </div>
</div>
{% endblock %}
