{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}
{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <i class="bi bi-question-circle-fill text-warning display-1 mb-3 d-block"></i>
        <h1 class="fw-bold">404 Page Not Found</h1>
        <p class="lead text-muted">The requested page or item could not be found. It may have been moved or soft-deleted.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">Browse Items</a>
    </div>
</div>
{% endblock %}
