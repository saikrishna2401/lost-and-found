{% extends "base.html" %}
{% block title %}500 Internal Server Error{% endblock %}
{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <i class="bi bi-exclamation-triangle-fill text-danger display-1 mb-3 d-block"></i>
        <h1 class="fw-bold">500 Server Error</h1>
        <p class="lead text-muted">Something went wrong on our end. The issue has been logged and database session safely rolled back.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">Back to Home</a>
    </div>
</div>
{% endblock %}
